name: dicepoker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dicepoker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dicepoker}
      POSTGRES_DB: ${POSTGRES_DB:-dicepoker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-dicepoker}:${POSTGRES_PASSWORD:-dicepoker}@db:5432/${POSTGRES_DB:-dicepoker}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      NUXT_OAUTH_GOOGLE_REDIRECT_URL: ${NUXT_OAUTH_GOOGLE_REDIRECT_URL:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
